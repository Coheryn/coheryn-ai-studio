[workspace]
members = ["crates/coheryn-engine", "crates/coheryn-api", "crates/coheryn-cli", "crates/coheryn-bench"]
resolver = "2"

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/Coheryn/coheryn-ai-studio"
homepage = "https://coheryntech.com/products/coheryn-ai-studio"

[workspace.dependencies]
coheryn-engine = { path = "crates/coheryn-engine" }
coheryn-api = { path = "crates/coheryn-api" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "fs", "io-util"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version="1.0.154", features=["raw_value", "float_roundtrip"] }
clap = { version = "4.6.7", features = ["derive"] }
sha2 = "0.11.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
