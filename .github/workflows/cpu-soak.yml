name: Opt-in modern CPU soak
on:
  push:
    branches:
      - 'qualification/cpu-soak/**'
  workflow_dispatch:
    inputs:
      modern_models:
        description: Acquire the pinned Qwen3.5/Nomic inputs and run the modern smoke after synthetic checks
        required: true
        default: true
        type: boolean
permissions:
  contents: read
concurrency:
  group: cpu-soak-${{ github.ref }}
  cancel-in-progress: false
jobs:
  soak:
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: windows-2022, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.x'
          check-latest: true
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - name: Verify native runner identity
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: python -c "import os,sys; sys.path.insert(0,'tools'); from verify_cpu_package import native_target; from cpu_qualification.common import require; require(native_target()==os.environ['EXPECTED_TARGET'],'unexpected native runner')"
      - name: Host preflight
        run: python tools/check_cpu_host.py --wait-for-load-seconds 300 --report .cache/cpu-soak-host.json
      - name: Check qualification controllers
        run: python tools/test_cpu_soak_runner.py
      - run: python tools/test_cpu_qualification.py
      - run: python tools/test_cpu_soak.py
      - run: python tools/test_cpu_shards.py
      - name: Prepare locked dependency graphs for offline license checks
        run: python tools/check_cpu_soak.py --fetch-only --report .cache/cpu-soak-dependencies.json
      - name: Check legal records with retained diagnostics
        run: python -c "import pathlib,subprocess,sys; r=subprocess.run([sys.executable,'tools/license_notices.py','--tracked'],capture_output=True,text=True); pathlib.Path('.cache/cpu-soak-legal.log').write_text(r.stdout+r.stderr,encoding='utf-8'); print(r.stdout+r.stderr); sys.exit(r.returncode)"
      - run: python tools/check_repository_policy.py
      - name: Guarded Rust tests and strict Clippy
        run: python tools/check_cpu_soak.py --report .cache/cpu-soak-checks.json
      - name: Synthetic operational smoke
        run: python tools/run_cpu_soak.py --profile fixtures/soak/cpu-smoke-v1.json --report .cache/cpu-soak-synthetic.json --timeout-seconds 300
      - name: Acquire and verify only pinned modern soak inputs
        if: ${{ github.event_name == 'push' || inputs.modern_models }}
        run: python tools/prepare_cpu_soak.py --fetch --download-attempts 2 --report .cache/cpu-soak-inputs.json
      - name: Shared modern text, vision and embedding smoke
        if: ${{ github.event_name == 'push' || inputs.modern_models }}
        run: python tools/run_cpu_soak.py --profile fixtures/soak/cpu-modern-shared-smoke-v1.json --models fixtures/soak/qwen35-shared-nomic-models-v2.json --report .cache/cpu-soak-modern.json --timeout-seconds 7200
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: cpu-soak-evidence-${{ matrix.target }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .cache/cpu-soak-host.json
            .cache/cpu-soak-legal.log
            .cache/cpu-soak-checks.json
            .cache/cpu-soak-checks/**
            .cache/cpu-soak-dependencies.json
            .cache/cpu-soak-checks/cpu-soak-dependencies/**
            .cache/cpu-soak-inputs.json
            .cache/cpu-soak-inputs/**
            .cache/cpu-soak-synthetic.json
            .cache/cpu-soak-modern.json
            .cache/cpu-soak/**
            !.cache/cpu-soak/**/store-*/**
