[package]
name = "coheryn-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"
repository = "https://github.com/Coheryn/coheryn-ai-studio"
homepage = "https://coheryntech.com/products/coheryn-ai-studio"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
serde_json = "1.0.154"
coheryn-engine = { path = "../crates/coheryn-engine" }

[[bin]]
name = "gguf"
path = "fuzz_targets/gguf.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tools"
path = "fuzz_targets/tools.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]

[[bin]]
name = "constraints"
path = "fuzz_targets/constraints.rs"
test = false
doc = false
bench = false

[[bin]]
name = "images"
path = "fuzz_targets/images.rs"
test = false
doc = false
bench = false

[[bin]]
name = "safetensors"
path = "fuzz_targets/safetensors.rs"
test = false
doc = false
bench = false
